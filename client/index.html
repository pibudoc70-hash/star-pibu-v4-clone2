    <!-- [CRITICAL] 브라우저 자동 스크롤 복원을 JS 번들 로드 전에 즉시 비활성화
         이 스크립트가 없으면 브라우저가 이전 스크롤 위치를 복원한 후 JS가 로드되어
         새로고침/재접속 시 메인이 아닌 중간 섹션에서 시작하는 버그 발생 -->
    <script>
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
      }
      // URL에 hash가 있으면 제거
      // [FIX v9] #dr-* hash는 sessionStorage(__star_dr_target)에 저장 후 URL에서 즉시 제거
      //   이유: hash가 URL에 남으면 브라우저 기본 hash 스크롤이 발생하고,
      //   이후 SpecialEventSection 이미지 로드 시 레이아웃 시프트로 위치가 밀림
      //   → 모든 스크롤 제어권을 JS(useDoctorViewModel.applyFromHash)에 위임
      if (window.location.hash) {
        var h = window.location.hash;
        var isDrHash = /^#dr-(cho|woo|lee)$/.test(h);
        if (isDrHash) {
          // sessionStorage에 저장 후 hash 제거 → 브라우저 기본 스크롤 차단
          try { sessionStorage.setItem('__star_dr_target', h.slice(1)); } catch(e) {}
          history.replaceState(null, '', window.location.pathname + window.location.search);
        } else {
          var KEEP = /^#(doctors$|section-|faq-)/.test(h);
          if (!KEEP) {
            history.replaceState(null, '', window.location.pathname + window.location.search);
          }
        }
      }
    </script>
