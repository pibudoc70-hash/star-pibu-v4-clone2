name: Performance Guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  bundle-size:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm size
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-stats
          path: dist/stats.html
          retention-days: 30

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: bundle-size
    # DB 없이도 Lighthouse 실행할 수 있도록 최소 시크릿만 필요
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL_TEST || 'mysql://test:test@127.0.0.1:3306/test' }}
      JWT_SECRET: ${{ secrets.JWT_SECRET_TEST || 'test-jwt-secret-for-ci-only' }}
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Playwright chromium 자동 설치 (lighthouse-audit.mjs 의 폴백용)
      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Build
        run: pnpm build

      # 프로덕션 서버 백그라운드 기동
      - name: Start server
        run: |
          nohup node dist/index.js > server.log 2>&1 &
          echo "SERVER_PID=$!" >> $GITHUB_ENV

      - name: Wait for server ready
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:3000/ > /dev/null; then
              echo "Server ready"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start"
          cat server.log
          exit 1

      - name: Run perf-audit
        run: pnpm perf:audit
        continue-on-error: true # 초기에는 실패해도 lighthouse 는 진행

      - name: Run Lighthouse
        run: pnpm perf:lighthouse
        continue-on-error: true # 초기 관측 기간에는 실패 허용

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-reports
          path: |
            perf-audit-report.json
            lighthouse-report.html
            lighthouse-report.json
          retention-days: 30

      - name: Stop server
        if: always()
        run: kill $SERVER_PID || true
